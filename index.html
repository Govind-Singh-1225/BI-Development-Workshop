<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="profile-card">

            <div class="profile-image">
                <svg viewBox="0 0 320 320" class="avatar">
                    <path d="M20 320 Q30 220 120 200 L200 200 Q290 220 300 320" fill="#536b80"/>
                    <path d="M120 200 L160 245 L200 200 L230 320 L90 320" fill="#ffffff"/>
                    <path d="M145 225 L175 225 L190 320 L130 320" fill="#713a9b"/>
                    <rect x="135" y="165" width="50" height="60" fill="#e8cdbd"/>
                    <ellipse cx="160" cy="120" rx="68" ry="85" fill="#efd8c9"/>
                    <path d="M92 120 Q80 35 145 20 Q220 5 230 100 L220 130 Q210 85 195 70 Q150 100 105 75 Z" fill="#343a42"/>
                    <path d="M95 85 Q105 25 165 25 Q210 25 225 80" fill="#343a42"/>
                </svg>
            </div>

            <div class="profile-info">

                <h2 id="userName">John Doe</h2>

                <p id="userRole">Male</p>

                <div class="buttons">

                    <button id="googleButton">
                        Google User
                    </button>

                    <button id="randomButton">
                        Random User
                    </button>

                </div>

                <p id="statusMessage"></p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
